esphome:
  name: garage-door-push-button
  friendly_name: Garage door push button

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced: 
      sram1_as_iram: true

logger:
  level: WARN

api:
  encryption:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Garage-Door-Push-Button"
    password: "wifi12345"

captive_portal:

switch:
  - platform: gpio
    id: opener_pulse
    name: "Garage Opener Pulse"
    icon: "mdi:garage"
    pin:
      number: GPIO26
      inverted: false
    restore_mode: ALWAYS_OFF

# --- Travel time control (yours) ---
number:
  - platform: template
    id: travel_time_s
    name: "Garage Travel Time (s)"
    icon: "mdi:timer-cog"
    optimistic: true
    min_value: 7
    max_value: 16
    step: 0.5
    initial_value: 11.0

# ======VIRTUAL COVER + CONTROL LOGIC

globals:
  # Simulated position (0.0 = closed, 1.0 = open)
  - id: door_pos
    type: float
    restore_value: yes
    initial_value: '0.0'   # Start fully closed

  # Movement state: 0=IDLE, 1=OPENING, 2=CLOSING
  - id: moving_dir
    type: int
    restore_value: no
    initial_value: '0'

  # Next start direction in the single-button cycle: 1=UP, 2=DOWN
  - id: next_start_dir
    type: int
    restore_value: yes
    initial_value: '1'  # Closed → next is Up

  # Timing
  - id: last_tick_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: should_publish_flag
    type: bool
    restore_value: no
    initial_value: 'false'

# --- Template cover definition ---
cover:
  - platform: template
    id: garage_cov
    name: "Garage Door (Virtual)"
    device_class: garage
    has_position: true
    open_action:
      - script.execute: ensure_opening
    close_action:
      - script.execute: ensure_closing
    stop_action:
      - script.execute: stop_motion

# --- Position sensor (0–100%) for dashboards (update_interval determins the number changing speed)---
sensor:
  - platform: template
    id: garage_position_pct
    name: "Garage Position (%)"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 300ms
    lambda: |-
      return round(id(door_pos) * 100.0);

# --- Binary sensors for UI availability
binary_sensor:
  - platform: gpio
    id: garage_door_status
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      # door closed when magnetic is close
      inverted: False
    name: "Garage Door Status"
    device_class: garage_door
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    on_press:
      then:
        - logger.log: "Garage Door is open"
        - lambda: |-
            if (id(moving_dir) == 0) { 
              id(moving_dir) = 1;       // opening
              id(next_start_dir) = 2;   // next start will be DOWN
            }
    on_release:
      then:
        - logger.log: "Garage Door full closed"
    #    - script.execute: calibrate_fully_closed
                
  - platform: template
    id: next_is_up
    name: "Garage Next is Up"
    lambda: |-
      return (id(moving_dir) == 0) && (id(next_start_dir) == 1);

  - platform: template
    id: next_is_down
    name: "Garage Next is Down"
    lambda: |-
      return (id(moving_dir) == 0) && (id(next_start_dir) == 2);

  - platform: template
    id: next_is_stop
    name: "Garage Next is Stop"
    lambda: |-
      return (id(moving_dir) != 0);

# --- Exported buttons (mutually exclusive in UI via sensors above) ---
button:
  - platform: template
    name: "Garage Up"
    id: btn_garage_up
    on_press:
      then:
        - script.execute: ensure_opening

  - platform: template
    name: "Garage Stop"
    id: btn_garage_stop
    on_press:
      then:
        - script.execute: stop_motion

  - platform: template
    name: "Garage Down"
    id: btn_garage_down
    on_press:
      then:
        - script.execute: ensure_closing

  - platform: template
    name: "Calibrate: Fully Closed"
    id: btn_calibrate_closed
    on_press:
      then:
        - script.execute: calibrate_fully_closed

  - platform: template
    name: "Calibrate: Fully Open"
    id: btn_calibrate_open
    on_press:
      then:
        - script.execute: calibrate_fully_open
# --- Movement engine: update position and publish cover state ---
interval:
  - interval: 400ms
    id: garage_door_pos_cal
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(last_tick_ms) == 0) { id(last_tick_ms) = now; }

          static float last_pos = -1.0f;
          static int last_dir = -1;

          bool should_publish = false;

          if (id(moving_dir) != 0) {
            float travel_s = id(travel_time_s).state;
            if (travel_s < 1.0f) travel_s = 1.0f;

            float dt = (now - id(last_tick_ms)) / 1000.0f;
            float delta = dt / travel_s;

            if (id(moving_dir) == 1) {  // OPENING
              id(door_pos) += delta;
              if (id(door_pos) >= 1.0f) {
                id(door_pos) = 1.0f;
                id(moving_dir) = 0;
              }
            } else if (id(moving_dir) == 2) {  // CLOSING
              id(door_pos) -= delta;
              if (id(door_pos) <= 0.0f) {
                id(door_pos) = 0.0f;
                id(moving_dir) = 0;
              }
            }
          }

          // Only publish if meaningful change
          if (fabsf(id(door_pos) - last_pos) > 0.01f || id(moving_dir) != last_dir) {
            last_pos = id(door_pos);
            last_dir = id(moving_dir);
            should_publish = true;
          }

          id(last_tick_ms) = now;

          // store flag for next step
          id(should_publish_flag) = should_publish;

      - if:
          condition:
            lambda: 'return id(should_publish_flag);'
          then:
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: !lambda |-
                  if (id(moving_dir) == 1) return COVER_OPERATION_OPENING;
                  if (id(moving_dir) == 2) return COVER_OPERATION_CLOSING;
                  return COVER_OPERATION_IDLE;

  - interval: 2s
    id: garage_door_pos_check
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: garage_door_status
              - lambda: 'return id(moving_dir) == 0;'
          then:
            - script.execute: calibrate_fully_closed
            - lambda: |-
                id(moving_dir) = 0;
                id(next_start_dir) = 1; 

# --- Direction-control scripts for single-input openers ---
script:
  # --- Single button press pulse ---
  - id: press_button
    mode: restart
    then:
      - switch.turn_on: opener_pulse
      - delay: 200ms
      - switch.turn_off: opener_pulse
  # Ensure opening (Up)
  - id: ensure_opening
    mode: restart
    then:
      - lambda: |-
          if (id(moving_dir) == 1) return;  // already opening

      # If closing → Stop first
      - if:
          condition:
            lambda: 'return id(moving_dir) == 2;'
          then:
            - script.execute: press_button
            - lambda: 'id(moving_dir) = 0;'
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: IDLE
            - delay: 800ms
      # If stopped and next start is UP → single press
      - if:
          condition:
            lambda: 'return id(moving_dir) == 0 && id(next_start_dir) == 1;'
          then:
            - script.execute: press_button
            - lambda: |-
                id(moving_dir) = 1;       // opening
                id(next_start_dir) = 2;   // next start will be DOWN
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: OPENING

      # If stopped and next start is DOWN → flip sequence (3 presses)
      - if:
          condition:
            lambda: 'return id(moving_dir) == 0 && id(next_start_dir) == 2;'
          then:
            - script.execute: press_button   # start DOWN
            - lambda: 'id(moving_dir) = 2;'
            - delay: 800ms
            - script.execute: press_button   # STOP
            - lambda: 'id(moving_dir) = 0;'
            - delay: 800ms
            - script.execute: press_button   # start UP
            - lambda: |-
                id(moving_dir) = 1;
                id(next_start_dir) = 2;
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: OPENING

  # Ensure closing (Down)
  - id: ensure_closing
    mode: restart
    then:
      - lambda: |-
          if (id(moving_dir) == 2) return;  // already closing

      # If opening → Stop first
      - if:
          condition:
            lambda: 'return id(moving_dir) == 1;'
          then:
            - script.execute: press_button
            - lambda: 'id(moving_dir) = 0;'
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: IDLE
            - delay: 800ms
      # If stopped and next start is DOWN → single press
      - if:
          condition:
            lambda: 'return id(moving_dir) == 0 && id(next_start_dir) == 2;'
          then:
            - script.execute: press_button
            - lambda: |-
                id(moving_dir) = 2;       // closing
                id(next_start_dir) = 1;   // next start will be UP
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: CLOSING

      # If stopped and next start is UP → flip sequence (3 presses)
      - if:
          condition:
            lambda: 'return id(moving_dir) == 0 && id(next_start_dir) == 1;'
          then:
            - script.execute: press_button   # start UP
            - lambda: 'id(moving_dir) = 1;'
            - delay: 800ms
            - script.execute: press_button   # STOP
            - lambda: 'id(moving_dir) = 0;'
            - delay: 800ms
            - script.execute: press_button   # start DOWN
            - lambda: |-
                id(moving_dir) = 2;
                id(next_start_dir) = 1;
            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: CLOSING

  # Stop motion (one press if moving)
  - id: stop_motion
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(moving_dir) != 0;'
          then:
            - script.execute: press_button
            - lambda: |-
                if (id(moving_dir) == 1) {
                  id(next_start_dir) = 2;  // was opening → next is DOWN
                } else if (id(moving_dir) == 2) {
                  id(next_start_dir) = 1;  // was closing → next is UP
                }
                id(moving_dir) = 0;

            - cover.template.publish:
                id: garage_cov
                position: !lambda 'return id(door_pos);'
                current_operation: IDLE

  # Calibrate to Fully Closed (0%)
  - id: calibrate_fully_closed
    mode: restart
    then:
      - lambda: |-
          id(last_tick_ms) = millis();
          // Stop any virtual movement and set position to fully closed
          id(moving_dir) = 0;
          id(door_pos) = 0.0f;
          // The next start should be UP
          id(next_start_dir) = 1;
      - cover.template.publish:
          id: garage_cov
          position: 0.0
          current_operation: IDLE

  # Calibrate to Fully Open (100%)
  - id: calibrate_fully_open
    mode: restart
    then:
      - lambda: |-
          id(last_tick_ms) = millis();
          // Stop any virtual movement and set position to fully open
          id(moving_dir) = 0;
          id(door_pos) = 1.0f;
          // The next start should be DOWN
          id(next_start_dir) = 2;
      - cover.template.publish:
          id: garage_cov
          position: 1.0
          current_operation: IDLE
